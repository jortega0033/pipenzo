# Vendored ruleset -- Pipenzo issue #320. See security-audit.yml's header comment for why this is
# committed rather than fetched from Semgrep's registry at gate-run time.
#
# Snapshot date: 2026-10-01. Modeled after Semgrep's own curated `p/secrets` pack: pattern-shaped
# detection of hardcoded credentials left in source, independent of gitleaks's own entropy-based
# scan (gitleaks and this ruleset are deliberately complementary, not a replacement for each
# other -- see review-gates.ts's deterministic gate list).
rules:
  - id: pipenzo-hardcoded-credential-assignment
    languages: [python, javascript, typescript, go, java]
    severity: ERROR
    message: >-
      A string literal is assigned to a variable, field, or key whose name suggests a credential
      (password/secret/token/api key). Hardcoded credentials in source are a standing leak the
      moment the file is shared or the repo goes public.
    metadata:
      category: security
      cwe: CWE-798
    patterns:
      - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)^(?!.*(test|fixture|example|dummy|placeholder)).*(password|passwd|pwd|secret|api[_-]?key|access[_-]?token|auth[_-]?token|private[_-]?key)

  - id: pipenzo-aws-access-key-id
    languages: [generic]
    severity: ERROR
    message: >-
      String matching the shape of an AWS access key ID (AKIA/ASIA followed by 16 alphanumeric
      characters). Rotate the credential and remove it from source history.
    metadata:
      category: security
      cwe: CWE-798
    pattern-regex: '\b(AKIA|ASIA)[0-9A-Z]{16}\b'

  - id: pipenzo-private-key-block
    languages: [generic]
    severity: ERROR
    message: >-
      A PEM-formatted private key block is committed in this file. Private keys must never live
      in source control; rotate the key and move it to a secret store.
    metadata:
      category: security
      cwe: CWE-321
    pattern-regex: '-----BEGIN (RSA |EC |OPENSSH |DSA |)PRIVATE KEY-----'

  - id: pipenzo-slack-token
    languages: [generic]
    severity: ERROR
    message: >-
      String matching the shape of a Slack bot/user/app token (xox[baprs]-...). Rotate the token
      and remove it from source history.
    metadata:
      category: security
      cwe: CWE-798
    pattern-regex: '\bxox[baprs]-[0-9A-Za-z-]{10,}\b'

  - id: pipenzo-generic-bearer-token-literal
    languages: [generic]
    severity: WARNING
    message: >-
      A literal "Bearer <token>" string is embedded directly in an Authorization header or
      similar call, rather than being read from configuration or a secret store at runtime.
    metadata:
      category: security
      cwe: CWE-798
    # A string literal is a single atomic AST node to semgrep's pattern matcher, so a pattern
    # like `"Bearer ..."` cannot match "a fixed prefix followed by anything" the way it would for
    # a function call or array -- only `pattern-regex` can look inside the literal's own text.
    pattern-regex: 'Bearer [A-Za-z0-9._-]{10,}'
